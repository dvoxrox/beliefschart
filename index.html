<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beliefs Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #controls { margin-bottom: 10px; }
    canvas { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1 id="page-title">Beliefs Chart</h1>

  <div id="controls">
    <label for="presetSelect">Preset:</label>
    <select id="presetSelect" aria-label="Preset selector">
      <option value="data/beliefs.json">Current Snapshot</option>
      <option value="data/beliefs_future.json">Future Target</option>
    </select>
  </div>

  <canvas id="radarChart" width="400" height="400"></canvas>

  <script>
    // Global chart reference
    let _radarChart = null;

    async function loadChartData(source) {
      try {
        const resp = await fetch(source);
        if (!resp.ok) throw new Error('Failed to load data');
        return await resp.json();
      } catch (e) {
        console.error('Data load error:', e);
        // Fallback data
        return {
          title: "Beliefs Chart",
          labels: ["Empiricism","Mystery","Tradition","Ethics","Community","Authority","Spiritual Experience","Science"],
          datasets: [{
            label: "Current Snapshot",
            data: [50, 60, 55, 70, 45, 65, 60, 75],
            backgroundColor: "rgba(54, 162, 235, 0.2)",
            borderColor: "rgba(54, 162, 235, 1)"
          }]
        };
      }
    }

    async function renderRadar(source) {
      const data = await loadChartData(source);
      const ctx = document.getElementById('radarChart').getContext('2d');
      if (window._radarChart) window._radarChart.destroy();

      window._radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: data.labels,
          datasets: data.datasets
        },
        options: {
          responsive: true,
          scales: {
            r: { beginAtZero: true, min: 0, max: 100 }
          }
          // you can add more options here
        }
      });

      if (data.title) document.getElementById('page-title').textContent = data.title;
    }

    // Initialize with default preset
    const presetSelect = document.getElementById('presetSelect');
    presetSelect.addEventListener('change', (e) => renderRadar(e.target.value));

    // First render
    renderRadar(presetSelect.value);
  </script>
</body>
</html>
