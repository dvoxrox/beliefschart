<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beliefs Radar Chart</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    canvas { max-width: 700px; width: 100%; }
  </style>
</head>
<body>
  <h1>Beliefs Radar Chart</h1>
  <canvas id="beliefsChart" width="400" height="400"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    async function loadData(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Failed to load ' + url);
      return resp.json();
    }

    async function render() {
      try {
        const [current, future] = await Promise.all([
          loadData('data/beliefs.json'),
          loadData('data/beliefs_future.json')
        ]);

        console.log('Current data:', current);
        console.log('Future data:', future);

        const ctx = document.getElementById('beliefsChart').getContext('2d');
        const labels = current.labels;

        new Chart(ctx, {
          type: 'radar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Current Snapshot',
                data: current.data,
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderColor: 'rgba(54, 162, 235, 1)'
              },
              {
                label: 'Future Target',
                data: future.data,
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderColor: 'rgba(255, 99, 132, 1)'
              }
            ]
          },
          options: { scales: { r: { beginAtZero: true, min: 0, max: 100 } } }
        });
      } catch (e) {
        console.error('Chart rendering error:', e);
      }
    }

    render();
  </script>
</body>
</html>
